# Load balancer for the partner push feed. Two front doors to the same ingest workers, so a run can compare them:
#   :8090  round robin            every posting goes to the next worker (the default most setups start with)
#   :8091  hash on X-Route-Key    every copy of one load goes to the same worker, so its dedup memory sees them all
# The workers are listed one `server` line each, in upstreams.conf (written by scripts/feed-steps.sh for the
# replicas that exist). Not `server feed-ingest:7200`: that one name resolves to every replica, and nginx's hash
# picks between server lines, not between the addresses behind one name, so it silently rotated through them
# (probe: 300 requests with one key went 100/100/100 to 3 workers).
worker_processes 2;
events { worker_connections 4096; }
http {
  access_log off;
  upstream ingest_rr   {                          include /etc/nginx/upstreams.conf; keepalive 256; }
  upstream ingest_hash { hash $http_x_route_key consistent; include /etc/nginx/upstreams.conf; keepalive 256; }
  server {
    listen 8090;
    location / { proxy_pass http://ingest_rr; proxy_http_version 1.1; proxy_set_header Connection ""; }
  }
  server {
    listen 8091;
    location / { proxy_pass http://ingest_hash; proxy_http_version 1.1; proxy_set_header Connection ""; }
  }
  server { listen 8092; location /nginx_status { stub_status; } }
}
