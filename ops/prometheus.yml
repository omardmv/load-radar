global:
  scrape_interval: 5s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/rules.yml]   # SLIs, error budgets, burn-rate alerts (SLO.md)
scrape_configs:
  - job_name: load-radar-engine
    static_configs:
      - targets: ["live:9464", "app:9464"]
  - job_name: load-radar-live          # answer-key counters for the SLOs
    static_configs:
      - targets: ["live:8080"]
  - job_name: otel-collector-llm
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: cluster-engine            # engine workers: every replica (Docker DNS); pipeline metrics
    dns_sd_configs:
      - names: [engine]
        type: A
        port: 9464
  - job_name: cluster-engine-api        # the same replicas: dispatcher API metrics
    dns_sd_configs:
      - names: [engine]
        type: A
        port: 8080
  - job_name: cluster-world
    static_configs:
      - targets: ["cluster-world:9464"]
  - job_name: cluster-dispatchers
    static_configs:
      - targets: ["dispatchers:9464"]
