# Tempo: trace storage that Grafana reads (Explore, Traces Drilldown). Local disk, kept 48 h.
# The local-blocks processor enables TraceQL metrics, which Traces Drilldown needs for its rate/error/duration charts.
stream_over_http_enabled: true
server:
  http_listen_port: 3200
  log_level: warn
distributor:
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: 0.0.0.0:4317 }
ingester:
  max_block_duration: 5m
compactor:
  compaction:
    block_retention: 48h
metrics_generator:
  storage:
    path: /var/tempo/generator/wal
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    local_blocks:
      filter_server_spans: false
      flush_to_storage: true
storage:
  trace:
    backend: local
    wal: { path: /var/tempo/wal }
    local: { path: /var/tempo/blocks }
overrides:
  defaults:
    metrics_generator:
      processors: [local-blocks]
