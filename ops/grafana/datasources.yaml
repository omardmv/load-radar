apiVersion: 1
# Metrics (Prometheus), traces (Tempo) and logs (Loki), linked both ways:
#   a log line -> its trace (trace_id), a span -> its logs, a latency exemplar -> its trace.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      exemplarTraceIdDestinations: [{ name: trace_id, datasourceUid: tempo }]
  - name: Tempo
    uid: tempo
    type: tempo
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        filterByTraceID: true
      tracesToMetrics: { datasourceUid: prometheus }
      nodeGraph: { enabled: true }
      search: { hide: false }
      traceQuery: { timeShiftEnabled: true, spanStartTimeShift: -1h, spanEndTimeShift: 1h }
  - name: Loki
    uid: loki
    type: loki
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: Trace
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: '$${__value.raw}'
