# Load balancer in front of the engine workers. Dispatchers' API calls (/api/dispatchers/<id>/...) are routed by a
# consistent hash of the dispatcher id, so one dispatcher always reaches the same worker: the worker that owns their
# logins, searches and alerts, and polls the boards for them.
# The workers are listed in upstreams.conf, one `server` line each with max_fails=0 (scripts/cluster-steps.sh writes
# it for the replicas that exist):
#   - one line per worker: nginx's hash picks between server lines, not between the addresses one name resolves to;
#   - max_fails=0: by default one failed request takes a worker out for 10 s and moves its dispatchers elsewhere.
worker_processes 2;
events { worker_connections 4096; }
http {
  access_log off;
  map $uri $dispatcher { ~^/api/dispatchers/(?<id>[^/]+) $id; default $uri; }
  upstream engines { include /etc/nginx/upstreams.conf; keepalive 256; }
  server {
    listen 8080;
    location / { proxy_pass http://engines; proxy_http_version 1.1; proxy_set_header Connection ""; }
  }
}
