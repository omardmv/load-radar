# Everything runs on one Linux server (see DEPLOY.md). Secrets come from .env (see .env.example).
#   OTel Collector :4318 ─┬─► Tempo (all traces)                          in Grafana
#                         ├─► Loki (structured logs, linked to traces)    in Grafana
#                         ├─► Langfuse (LLM / GenAI spans only)           UI :3001
#                         └─► Prometheus (span metrics for GenAI spans)   UI :9090
#   Prometheus scrapes the live engine (live:9464) and batch runs (app:9464). Grafana :3000 reads Prometheus, Tempo and Loki.
#   Models: gliner2 :7100 (GLiNER2, CPU) and ollama :11434 (Qwen 2.5 1.5B, CPU).
# Every port is published on the server's 127.0.0.1 only; reach the UIs through the SSH tunnel.
services:
  # ---------- Engine, simulators, eval (run on demand) ----------
  #   docker compose run --rm --use-aliases app node scripts/run.ts ...
  app:
    image: node:26-slim
    profiles: [app]
    working_dir: /app
    volumes: [".:/app", "app_node_modules:/app/node_modules"]
    command: ["node", "--version"]

  # ---------- Live mode: new data forever + the UI (http://localhost:8080 through the tunnel) ----------
  live:
    build: { context: ., dockerfile: live/Dockerfile }
    restart: unless-stopped
    command: ["--port", "8080", "--speed", "1", "--loads-per-day", "20000", "--users", "300",
              "--gliner", "http://gliner2:7100", "--otlp", "http://otel-collector:4318/v1/traces", "--state", "/state"]
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["live_state:/state"]          # your saved searches survive restarts and deploys
    depends_on: [gliner2, otel-collector]

  # ---------- Models for the search parser ----------
  gliner2:
    build: ./ml/parser
    image: load-radar-gliner2
    restart: unless-stopped
    ports: ["127.0.0.1:7100:7100"]
    volumes: ["gliner2_cache:/root/.cache/huggingface"]
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports: ["127.0.0.1:11434:11434"]
    volumes: ["ollama_models:/root/.ollama"]

  # ---------- Observability ----------
  otel-collector:
    restart: unless-stopped
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./ops/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    environment:
      - LANGFUSE_OTEL_AUTH=${LANGFUSE_OTEL_AUTH}
    ports: ["127.0.0.1:4318:4318"]
    depends_on: [tempo, loki]
  tempo:
    image: grafana/tempo:2.8.2
    restart: unless-stopped
    user: "0"                          # writes to the named volume without a chown step
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./ops/tempo.yaml:/etc/tempo.yaml:ro", "tempo_data:/var/tempo"]
  loki:
    image: grafana/loki:3.5.5
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]   # single binary, local disk, native OTLP ingest
    volumes: ["loki_data:/loki"]
  prometheus:
    restart: unless-stopped
    image: prom/prometheus:latest
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--enable-feature=exemplar-storage"]
    volumes: ["./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    restart: unless-stopped
    image: grafana/grafana:latest
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes: ["./ops/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro"]
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus, tempo, loki]

  # ---------- Langfuse v4, self-hosted (LLM observability) ----------
  # Based on the official langfuse/langfuse docker-compose.yml. Only the web UI (3001) and MinIO (9095,
  # needed for media URLs in the browser) are published; Postgres, ClickHouse and Redis stay inside Docker.
  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    restart: always
    depends_on: &langfuse-depends-on
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      redis: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    environment: &langfuse-env
      NEXTAUTH_URL: http://localhost:3001
      DATABASE_URL: postgresql://postgres:${LANGFUSE_POSTGRES_PASSWORD}@postgres:5432/postgres
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9095
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_AUTH}
      REDIS_TLS_ENABLED: "false"
  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    restart: always
    depends_on: *langfuse-depends-on
    ports: ["127.0.0.1:3001:3000"]
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
      # Headless setup: one org, one project with fixed API keys, one local login (all from .env).
      LANGFUSE_INIT_ORG_ID: load-radar
      LANGFUSE_INIT_ORG_NAME: Load Radar
      LANGFUSE_INIT_PROJECT_ID: load-radar-parser
      LANGFUSE_INIT_PROJECT_NAME: Search parser
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: Load Radar dev
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.3.62.3
    restart: always
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s
  minio:
    image: cgr.dev/chainguard/minio
    restart: always
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD}
    ports: ["127.0.0.1:9095:9000"]
    volumes: [langfuse_minio_data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s                        # official compose uses 1s; that cost ~6% of a core on this laptop
      timeout: 5s
      retries: 5
      start_period: 1s
  redis:
    image: docker.io/redis:7
    restart: always
    command: --requirepass ${LANGFUSE_REDIS_AUTH} --maxmemory-policy noeviction
    volumes: [langfuse_redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LANGFUSE_REDIS_AUTH}", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10
  postgres:
    image: docker.io/postgres:17
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    volumes: [langfuse_postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  tempo_data:
  loki_data:
  live_state:
  app_node_modules:
  gliner2_cache: { name: gliner2-cache, external: true }   # created once on the server; holds the downloaded model
  ollama_models:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  langfuse_redis_data:
